{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff login | AMOX Homes</title><link rel="icon" href="{% static 'core/logo-sm.png' %}"><link rel="stylesheet" href="{% static 'core/site.css' %}"></head>
<body class="min-h-screen grid place-items-center p-4 bg-navy bg-cover bg-center" style="background-image:linear-gradient(rgba(10,42,107,.82),rgba(10,42,107,.9)),url({% static 'core/hero-desktop.webp' %})">
<form method="post" class="w-full max-w-sm bg-white rounded-3xl shadow-2xl p-7 grid gap-4">{% csrf_token %}
<div class="text-center"><img src="{% static 'core/logo-sm.png' %}" alt="" width="56" height="56" class="mx-auto h-14 w-14 object-contain"><h1 class="mt-2 text-2xl font-extrabold text-navy">AMOX<span class="text-sky">Homes</span> Console</h1><p class="text-sm text-slate-500">Staff sign in</p></div>
{% if form.non_field_errors %}<p class="rounded-xl bg-red-50 text-red-700 text-sm px-3 py-2" role="alert">{{ form.non_field_errors|last }}</p>{% endif %}
<label class="text-sm font-semibold text-slate-700">Username<input name="username" autocomplete="username" autofocus required class="mt-1 w-full rounded-xl border px-3 py-2.5 font-normal"></label>
<label class="text-sm font-semibold text-slate-700">Password<input type="password" name="password" autocomplete="current-password" required class="mt-1 w-full rounded-xl border px-3 py-2.5 font-normal"></label>
<button class="bg-brand hover:bg-navy text-white font-semibold rounded-full py-3 transition">Sign in</button>
<a href="{% url 'home' %}" class="text-center text-sm text-slate-500 underline">Back to website</a></form></body></html>
