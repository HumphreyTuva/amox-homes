{% if f.field.widget.input_type == 'radio' %}<fieldset class="block"><legend class="text-sm font-semibold text-slate-700">{{ f.label }}{% if f.field.required %} *{% endif %}</legend><div class="mt-1 grid grid-cols-2 gap-3">{% for w in f %}<label class="cursor-pointer"><input type="radio" name="{{ w.data.name }}" value="{{ w.data.value }}" class="peer sr-only" {% if w.data.selected %}checked{% endif %}><span class="block rounded-xl border-2 border-slate-300 bg-white px-4 py-3 text-center font-semibold text-slate-600 transition hover:border-brand peer-checked:border-brand peer-checked:bg-brand peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-sky">{{ w.choice_label }}</span></label>{% endfor %}</div>{% if f.help_text %}<span class="text-xs font-normal text-slate-500">{{ f.help_text }}</span>{% endif %}{% for e in f.errors %}<span class="block text-red-600 text-xs">{{ e }}</span>{% endfor %}</fieldset>{% else %}<label class="block text-sm font-semibold text-slate-700">{{ f.label }}{% if f.field.required %} *{% endif %}<div class="mt-1 font-normal">{{ f }}</div>
