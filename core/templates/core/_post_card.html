<a href="{{ p.get_absolute_url }}" class="lift zoom block min-w-0 overflow-hidden rounded-2xl border bg-white">{% if p.cover %}<img src="{{ p.cover.url }}" alt="" width="640" height="360" loading="lazy" class="aspect-[16/9] w-full object-cover">{% else %}<div class="grid aspect-[16/9] w-full place-items-center bg-gradient-to-br from-sky to-brand text-5xl font-extrabold text-white/80" aria-hidden="true">{{ p.title|slice:":1" }}</div>{% endif %}<div class="p-4"><span class="rounded bg-mist px-2 py-0.5 text-xs font-bold text-navy">{{ p.get_category_display }}</span><h3 class="mt-2 font-bold leading-snug text-navy">{{ p.title }}</h3><p class="mt-1 line-clamp-3 text-sm text-slate-600">{{ p.summary }}</p><p class="mt-2 text-xs text-slate-400">{{ p.published_at|date:"j M Y" }} · {{ p.read_minutes }} min read</p></div></a>
